services:
  proxy:
    image: ubuntu/squid:latest
    container_name: sandbox-proxy
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - egress
      - sandbox
    restart: unless-stopped

  agent:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: ai-agent-sandbox:latest
    environment:
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,proxy
      no_proxy: localhost,127.0.0.1,proxy
      TERM: ${TERM:-xterm}
    env_file:
      - path: ./sandbox.env
        required: false
    dns:
      - 192.0.2.1
    volumes:
      - ${WORKSPACE_DIR:-.}:/workspace
      - agent-home:/home/agent
      # Сессии, история и auth-токены opencode - на хосте (переживают всё)
      - ./agent-data:/home/agent/.local/share/opencode
      # Конфиг opencode (opencode.json) - на хосте
      - ./agent-config:/home/agent/.config/opencode
    working_dir: /workspace
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    init: true
    networks:
      - sandbox

networks:
  sandbox:
    internal: true
  egress:

volumes:
  agent-home:
